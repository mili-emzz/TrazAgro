services:
  postgres:
    image: postgres:16-alpine
    container_name: trazaagro-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trazaagro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trazaagro_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trazaagro}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/relational:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trazaagro} -d ${POSTGRES_DB:-trazaagro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: trazaagro-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-trazaagro}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-trazaagro_dev_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-trazaagro}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/document:/scripts:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: trazaagro-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-trazaagro_dev_pass}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - ./database/graph:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-trazaagro_dev_pass} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
